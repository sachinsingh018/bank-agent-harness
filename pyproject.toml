[project]
name = "bank-agent-harness"
version = "0.1.0"
description = "Agent harness for bank client lifecycle work (AML, KYB, credit)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "sqlalchemy>=2",
  "psycopg[binary]",
  "alembic",
  "mcp==2.3.0",
  "anthropic==2.3.0",
  "openai==3.42.0",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "pre-commit", "httpx"]

[tool.uv]
package = false
# Keep brand new releases out: sse-starlette 3.7.0 was under two weeks old when mcp was added.
# Raise or remove this once the newer version has aged.
constraint-dependencies = ["sse-starlette<3.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["apps", "harness", "tools", "modules", "evals", "data"]
