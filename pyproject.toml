[project]
name = "bank-agent-harness"
version = "0.1.0"
description = "Agent harness for bank client lifecycle work (AML, KYB, credit)"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "sqlalchemy>=2",
  "psycopg[binary]",
  "alembic",
]

[dependency-groups]
dev = ["pytest", "ruff", "mypy", "pre-commit", "httpx"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["apps", "harness", "tools", "modules", "evals"]
