name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/harness
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps harness migrations data modules evals tools tests_support
      - name: Prepare local test database
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/harness
          PYTHONPATH: .
        run: |
          uv run alembic upgrade head
          uv run python -m data.load_aml_slice load
      - run: uv run pytest
      - name: Fast agent eval (scripted, no API key)
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/harness
          HARNESS_WRITE_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/harness
          PYTHONPATH: .
        run: |
          set -o pipefail
          uv run python -m modules.aml.run_rules --ruleset v1
          uv run python -m evals.run_aml_agent --dataset evals/datasets/aml_alerts_smoke_v2.json --profile scripted --record | tee runner.log
          run_dir="$(tail -n 1 runner.log | sed -n 's/^run_dir=//p')"
          test -n "$run_dir"
          uv run python -m evals.aml_agent_score --run "$run_dir" --record
          uv run python -m harness.records verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
