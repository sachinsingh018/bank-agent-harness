services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ..:/workspaces/bank-agent-harness:cached
      # Claude Code chat history and settings survive container rebuilds.
      - claude-home:/home/vscode/.claude
    command: sleep infinity
    depends_on:
      - db
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # Local dev only. Real credentials live in Neon and are never committed.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: harness
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
  claude-home:
