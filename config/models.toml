# Model profiles. No secrets here: API keys come only from env vars
# (ANTHROPIC_API_KEY, OPENROUTER_API_KEY). Model ids live only in this file.
# Prices are USD per million tokens, written as decimal strings for exact math.

[profiles.claude-opus]
provider = "anthropic"
model = "claude-opus-5-5"
max_output_tokens = 16000
effort = "medium"

[profiles.claude-opus.prices]
input = "4.00"
output = "20.00"
cache_read = "0.20"
cache_write = "5.00"

# Free models on OpenRouter change often. This is a placeholder meant to be
# swapped for whatever free model is currently available. Never depend on it.
[profiles.openrouter-free-dev]
provider = "openrouter"
model = "nvidia/nemotron-3-ultra-550b-a55b:free"  # chosen 2026-11-16, free tier: 50 requests a day
max_output_tokens = 8000

[profiles.openrouter-free-dev.prices]
input = "0"
output = "0"
cache_read = "0"
cache_write = "0"

# US or EU hosted open-weight model for later benchmarks.
[profiles.openrouter-eu-us-open]
provider = "openrouter"
model = "meta-llama/llama-3.3-70b-instruct"
max_output_tokens = 8000

# Placeholder host: confirm a US or EU host on OpenRouter before any benchmark run.
[profiles.openrouter-eu-us-open.provider_routing]
only = ["together"]
allow_fallbacks = false

# TODO: placeholder prices, confirm against the chosen host before benchmarks.
[profiles.openrouter-eu-us-open.prices]
input = "0.60"
output = "0.60"
cache_read = "0"
cache_write = "0"

# No network. Used by tests and the CI fast eval.
[profiles.scripted]
provider = "scripted"
model = "scripted"
max_output_tokens = 16000

[profiles.scripted.prices]
input = "0"
output = "0"
cache_read = "0"
cache_write = "0"
