# Agent loop limits. Hitting any of them routes the case to human review.

[limits]
max_tool_steps = 12
# Counts every processed token, cached ones included (input, cache read,
# cache write and output), because every turn resends the growing conversation.
max_total_tokens = 600000
max_wall_seconds = 300
max_output_tokens_per_call = 16000

# The checker in maker-checker reviews findings that already passed the verifiers, so it gets
# fewer tool steps and a smaller token budget. The wall clock rules are the same.
[reviewer]
max_tool_steps = 6
max_total_tokens = 300000
max_wall_seconds = 300
max_output_tokens_per_call = 16000

# Langfuse tracing (harness/tracing.py). Only active when LANGFUSE_PUBLIC_KEY,
# LANGFUSE_SECRET_KEY and LANGFUSE_HOST are set. Eval runs trace every case; routine runs
# trace a deterministic share (hash of case id and run id) to stay within the free tier.
[tracing]
enabled = true
sample_routine = 0.1
